<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff5f8">
<title>Shop | Ovee Bangles</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 color:#39242c;
 background:linear-gradient(135deg,#fff5f8,#f8efe5);
}
.container{width:min(100% - 28px,1000px);margin:auto}
header{text-align:center;padding:25px 0}
h1{margin:8px 0;font-size:32px}
.subtitle{color:#755b65;line-height:1.6}
.button{
 display:block;padding:13px;margin:12px 0;
 border-radius:12px;text-align:center;
 text-decoration:none;font-weight:bold;
 background:#8b3156;color:white;
}
h2{font-size:23px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}
.filter{
 border:1px solid #d8b8c6;border-radius:30px;
 background:white;color:#73304e;padding:10px 14px;
 cursor:pointer;
}
.filter.active{background:#8b3156;color:white}
.products{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
 gap:13px;
}
.product{
 background:white;border-radius:14px;overflow:hidden;
 box-shadow:0 3px 12px #4b203010;
}
.product img{
 width:100%;aspect-ratio:1/1;object-fit:contain;
 background:white;display:block;
}
.product-info{padding:11px}
.product h3{font-size:15px;margin:0 0 7px}
.code{font-size:12px;color:#78616b}
.prices{margin:9px 0;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.mrp{text-decoration:line-through;text-decoration-color:red;color:#8b777e;font-size:13px}
.sale{color:#a5224f;font-weight:bold;font-size:19px}
.stock,.description{font-size:12px;color:#65515a;line-height:1.5}
.order{
 display:block;background:#25D366;color:#123e23;
 padding:10px;text-align:center;text-decoration:none;
 border-radius:8px;font-size:13px;font-weight:bold;margin-top:10px;
}
.message{text-align:center;padding:20px;color:#755b65}
.footer{text-align:center;padding:25px;color:#755b65;font-size:13px}
@media(min-width:600px){
 .products{grid-template-columns:repeat(3,minmax(0,1fr))}
}
</style>
</head>

<body>
<div class="container">

<header>
<h1>OVEE BANGLES</h1>
<div class="subtitle">Our Product Catalogue<br>Choose your favourite design ❤️</div>
</header>

<a class="button" href="index.html">← Back to Home</a>

<main>
<h2>🛍️ Shop Our Products</h2>

<div class="filters">
<button class="filter active" data-category="all">All Products</button>
<button class="filter" data-category="bangles">Bangles</button>
<button class="filter" data-category="chain">Chains</button>
<button class="filter" data-category="earring">Earrings</button>
</div>

<div id="status" class="message">Loading products...</div>
<div id="products" class="products"></div>

<section id="trending-section" hidden>
<h2>🔥 Trending Now</h2>
<div id="trending-products" class="products"></div>
</section>

<section id="new-section" hidden>
<h2>✨ New Arrivals</h2>
<div id="new-products" class="products"></div>
</section>

<section id="offers-section" hidden>
<h2>🎁 Special Offers</h2>
<div id="offer-products" class="products"></div>
</section>
</main>

<div class="footer">
Ovee Bangles · Store-room to customer ❤️
</div>
</div>

<script>
const API_URL = "https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnQ1sHIuhxBQNY4PblA3-LQuUdcyFXRwIsvTH2UugeqG7dqigwOezj7yj30oR52uRmj5WVvLH9A7QML4NVRuxbwsCObE_vSh6xkJ8Y5TJFYktlaPuG5BdXRubDSKEypUsdeabCZLJ6LQQyCcrT6V4GtPOgK9xHlFq2hIlXDxOr0v52qRuRlOY9-gQZGPUgdRMRKtOSSGxGOJ2BjFZdEq9vPD8HdqNq1k4_cR_3Jy6IHMaKeMJ6P2Cbu2LH30IZZfK6e_5UwgNfOdW4oCszg&lib=MwyUwGAuXEdzyqdQjavtIe46RGsciQkmU";

const productsEl=document.getElementById("products");
const statusEl=document.getElementById("status");
let allProducts=[];
let selectedCategory="all";

function categoryKey(value){
 const c=String(value||"").toLowerCase();
 if(c.includes("bangle"))return "bangles";
 if(c.includes("chain"))return "chain";
 if(c.includes("earring"))return "earring";
 return c;
}

function imageUrl(url){
 const value=String(url||"");
 const match=value.match(/\/file\/d\/([^/]+)/);
 return match
 ? "https://drive.google.com/thumbnail?id="+encodeURIComponent(match[1])+"&sz=w900"
 : value;
}

function createProductCard(p){
 const card=document.createElement("article");
 card.className="product";
 const img=document.createElement("img");
 img.src=imageUrl(p.photo);
 img.alt=p.name||"Product";
 img.loading="lazy";
 img.onerror=()=>img.removeAttribute("src");
 card.appendChild(img);

 const info=document.createElement("div");
 info.className="product-info";
 const title=document.createElement("h3");
 title.textContent=p.name||"Ovee Bangles Product";
 info.appendChild(title);

 const code=document.createElement("div");
 code.className="code";
 code.textContent="Code: "+(p.code||"");
 info.appendChild(code);

 const prices=document.createElement("div");
 prices.className="prices";
 const mrp=document.createElement("span");
 mrp.className="mrp";
 mrp.textContent="MRP "+(p.mrp||"");
 const sale=document.createElement("span");
 sale.className="sale";
 sale.textContent=p.salePrice||"";
 prices.append(mrp,sale);
 info.appendChild(prices);

 const quantity=Number(p.stock);
 const stock=document.createElement("div");
 stock.className="stock";
 stock.textContent=quantity>0?"In stock: "+p.stock:"Currently unavailable";
 info.appendChild(stock);

 if(p.description){
  const desc=document.createElement("p");
  desc.className="description";
  desc.textContent=p.description;
  info.appendChild(desc);
 }

 if(quantity>0){
  const message="Hello Ovee Bangles! I want to order: "+p.name+
  ", Product Code: "+p.code+", Price: "+p.salePrice;
  const order=document.createElement("a");
  order.className="order";
  order.href="https://wa.me/?text="+encodeURIComponent(message);
  order.target="_blank";
  order.rel="noopener";
  order.textContent="Order on WhatsApp";
  info.appendChild(order);
 }
 card.appendChild(info);
 return card;
}

function renderProducts(list,container){
 container.replaceChildren();
 list.forEach(p=>container.appendChild(createProductCard(p)));
}

function renderCatalogue(){
 const filtered=allProducts.filter(p=>
 selectedCategory==="all"||categoryKey(p.category)===selectedCategory
 );
 renderProducts(filtered,productsEl);
 statusEl.textContent=filtered.length
 ? "Showing "+filtered.length+" product(s)"
 : "No products in this category right now.";
}

function renderFlagSection(flags,sectionId,listId){
 const featured=allProducts.filter(p=>
 flags.some(f=>["yes","true","1"].includes(String(p[f]||"").toLowerCase())||p[f]===true)
 );
 document.getElementById(sectionId).hidden=featured.length===0;
 if(featured.length)renderProducts(featured,document.getElementById(listId));
}

document.querySelectorAll(".filter").forEach(button=>{
 button.addEventListener("click",()=>{
  selectedCategory=button.dataset.category;
  document.querySelectorAll(".filter").forEach(b=>b.classList.toggle("active",b===button));
  renderCatalogue();
 });
});

async function loadProducts(){
 try{
  const response=await fetch(API_URL,{cache:"no-store"});
  if(!response.ok)throw new Error("Product API error");
  const data=await response.json();
  if(!data.success||!Array.isArray(data.products))throw new Error("Invalid data");

  allProducts=data.products.filter(p=>Number(p.stock)>0);
  renderCatalogue();
  renderFlagSection(["Trending","trending"],"trending-section","trending-products");
  renderFlagSection(["New_Arrival","newArrival","new_arrival"],"new-section","new-products");
  renderFlagSection(["special_offer","specialOffer","Special_Offer"],"offers-section","offer-products");
 }catch(error){
  statusEl.textContent="Products load nahi ho paaye. Thodi der baad try karein.";
  console.error(error);
 }
}
loadProducts();
</script>
</body>
</html>
